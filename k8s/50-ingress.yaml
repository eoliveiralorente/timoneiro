apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timoneiro
  namespace: timoneiro
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [timoneiro.200-229-75-14.sslip.io]
      secretName: timoneiro-tls
  rules:
    - host: timoneiro.200-229-75-14.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: timoneiro, port: {number: 80}}
  # tls:
  #   - hosts: [timoneiro.200-229-75-14.sslip.io]
  #     secretName: timoneiro-tls
