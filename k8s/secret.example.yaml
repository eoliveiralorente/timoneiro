# NÃO versione o arquivo real. Gere com:
#   kubectl -n timoneiro create secret generic timoneiro-secrets \
#     --from-literal=APP_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=ADMIN_EMAILS="seu-email@dominio.com"
apiVersion: v1
kind: Secret
metadata:
  name: timoneiro-secrets
  namespace: timoneiro
type: Opaque
stringData:
  APP_SECRET: "troque-por-um-valor-aleatorio-com-pelo-menos-32-caracteres"
  ADMIN_TOKEN: "troque-por-outro-valor-aleatorio-24+"   # token de emergência do /admin
  ADMIN_EMAILS: "seu-email@dominio.com"                 # contas que entram no /admin com e-mail e senha
