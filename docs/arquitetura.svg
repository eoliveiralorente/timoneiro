<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Arquitetura do Timoneiro</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f6b7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="920" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="20" font-weight="600" fill="#0b1f3a">Timoneiro · arquitetura</text>
  <text x="32" y="66" font-size="13" fill="#5f6b7a">Node 22 sem dependências · SQLite em volume persistente · Traefik + cert-manager</text>

  <!-- externos -->
  <g>
    <rect x="32" y="110" width="170" height="64" rx="10" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="117" y="137" font-size="15" font-weight="600" fill="#2c2c2a" text-anchor="middle">Aluno</text>
    <text x="117" y="157" font-size="12" fill="#5f5e5a" text-anchor="middle">celular ou PC (HTTPS)</text>
    <rect x="32" y="290" width="170" height="64" rx="10" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="117" y="317" font-size="15" font-weight="600" fill="#2c2c2a" text-anchor="middle">Mentor</text>
    <text x="117" y="337" font-size="12" fill="#5f5e5a" text-anchor="middle">/admin · e-mail ou token</text>
    <rect x="32" y="430" width="170" height="64" rx="10" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="117" y="457" font-size="15" font-weight="600" fill="#2c2c2a" text-anchor="middle">CSV de leads</text>
    <text x="117" y="477" font-size="12" fill="#5f5e5a" text-anchor="middle">e-mail · WhatsApp</text>
  </g>

  <!-- cluster -->
  <rect x="250" y="90" width="638" height="440" rx="20" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="274" y="118" font-size="14" font-weight="600" fill="#085041">Cluster Kubernetes · namespace timoneiro</text>

  <!-- traefik -->
  <rect x="282" y="140" width="250" height="70" rx="10" fill="#eeedfe" stroke="#534ab7"/>
  <text x="407" y="166" font-size="15" font-weight="600" fill="#3c3489" text-anchor="middle">Traefik · Ingress</text>
  <text x="407" y="186" font-size="12" fill="#534ab7" text-anchor="middle">TLS + redirect http → https</text>

  <!-- cert-manager -->
  <rect x="580" y="140" width="280" height="70" rx="10" fill="#eeedfe" stroke="#534ab7"/>
  <text x="720" y="166" font-size="15" font-weight="600" fill="#3c3489" text-anchor="middle">cert-manager</text>
  <text x="720" y="186" font-size="12" fill="#534ab7" text-anchor="middle">certificado Let's Encrypt</text>

  <!-- pod -->
  <rect x="282" y="262" width="250" height="70" rx="10" fill="#eeedfe" stroke="#534ab7"/>
  <text x="407" y="288" font-size="15" font-weight="600" fill="#3c3489" text-anchor="middle">Pod timoneiro</text>
  <text x="407" y="308" font-size="12" fill="#534ab7" text-anchor="middle">server.js · jogo · API · /admin</text>

  <!-- config -->
  <rect x="580" y="262" width="280" height="70" rx="10" fill="#eeedfe" stroke="#534ab7"/>
  <text x="720" y="288" font-size="15" font-weight="600" fill="#3c3489" text-anchor="middle">Secret + ConfigMap</text>
  <text x="720" y="308" font-size="12" fill="#534ab7" text-anchor="middle">chaves, ADMIN_EMAILS, links</text>

  <!-- volume -->
  <rect x="282" y="390" width="578" height="96" rx="10" fill="#faece7" stroke="#993c1d"/>
  <text x="571" y="418" font-size="15" font-weight="600" fill="#712b13" text-anchor="middle">Volume persistente (PVC 1 Gi) · SQLite</text>
  <text x="571" y="442" font-size="12" fill="#993c1d" text-anchor="middle">users: conta, WhatsApp, área, progresso, aceites</text>
  <text x="571" y="462" font-size="12" fill="#993c1d" text-anchor="middle">consent_log: histórico de cada aceite e descadastro (LGPD)</text>

  <!-- setas -->
  <line x1="202" y1="160" x2="280" y2="168" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M202 322 L238 322 L238 196 L280 196" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="175" x2="534" y2="175" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="407" y1="210" x2="407" y2="260" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="297" x2="534" y2="297" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="407" y1="332" x2="407" y2="388" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="117" y1="354" x2="117" y2="428" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
