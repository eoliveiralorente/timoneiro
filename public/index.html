<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Timoneiro — Lab Kubernetes</title>
<link rel="icon" href="/favicon.svg">
<meta name="author" content="Eduardo Lorente de Oliveira">
<meta name="description" content="Timoneiro: aprenda Kubernetes navegando por ilhas, tempestades e plantões. Criado por Eduardo Lorente de Oliveira.">
<meta property="og:site_name" content="Timoneiro">
<meta property="og:title" content="Timoneiro — o jogo para aprender Kubernetes">
<meta property="og:description" content="Criado por Eduardo Lorente de Oliveira, Arquiteto de Soluções Cloud. Conceitos e comandos com base na documentação oficial.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b1a;--glass:rgba(10,22,46,.72);--glass2:rgba(18,36,70,.85);--line:rgba(120,170,255,.22);--txt:#eaf2ff;--mut:#8ea3c7;--gold:#f6c453;--gold2:#ffdf8a;--cy:#3fe0ff;--gr:#4ade80;--rd:#ff4d6d;--pu:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Rajdhani,system-ui,sans-serif;color:var(--txt);font-weight:600}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;font-weight:700}
a{color:var(--cy)}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
#screen{position:absolute;inset:0;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mono{font-family:"JetBrains Mono",monospace}
.epic{font-family:"Cinzel Decorative",serif}
canvas#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;padding:12px 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.player{flex:1;display:flex;gap:10px;align-items:center;padding:8px 10px}
.emblem{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c7902a 55%,#6b4310);box-shadow:0 0 0 2px #3b2608,0 0 16px rgba(246,196,83,.55);flex:none}
.pinfo{flex:1;min-width:0}
.pinfo .rk{font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.pinfo .nm{font-size:17px;line-height:1.05}
.xpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f6a821,#ffe08a);box-shadow:0 0 10px #f6c453;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sheen 2.6s infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}
.side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.stat{padding:6px 10px;font-size:15px;display:flex;align-items:center;gap:6px;justify-content:space-between;min-width:96px}
.stat small{font-size:10px;color:var(--mut);letter-spacing:1px}
.shield{display:flex;gap:3px}
.shield i{width:12px;height:14px;clip-path:polygon(50% 0,100% 20%,90% 75%,50% 100%,10% 75%,0 20%);background:rgba(255,255,255,.12)}
.shield i.on{background:linear-gradient(180deg,#7dfcb5,#1fb46a);filter:drop-shadow(0 0 4px #4ade80)}
.shield.low i.on{background:linear-gradient(180deg,#ff9aa9,#e0284a);filter:drop-shadow(0 0 4px #ff4d6d)}
.iconbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px 12px;z-index:3;pointer-events:none}
.bottom>*{pointer-events:auto}
.cta{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border-radius:16px;text-align:left;background:linear-gradient(135deg,rgba(246,196,83,.95),rgba(214,140,30,.95));color:#2a1700;box-shadow:0 0 0 2px rgba(255,230,160,.5),0 10px 30px rgba(246,160,40,.45);position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 3s infinite}
.cta .play{width:44px;height:44px;border-radius:50%;background:#2a1700;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.cta small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}
.cta b{font-size:19px;line-height:1.1}
.tabs{display:flex;padding:6px}
.tabs button{flex:1;background:none;padding:8px 0 6px;color:var(--mut);font-size:20px;border-radius:10px}
.tabs button div{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.tabs button.on{color:var(--gold);background:rgba(246,196,83,.1);text-shadow:0 0 12px rgba(246,196,83,.6)}

/* Splash */
.splash{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(5,11,26,.15),rgba(5,11,26,.85) 75%);animation:fadein .8s}
.logo{font-family:"Cinzel Decorative",serif;font-weight:900;font-size:46px;letter-spacing:2px;background:linear-gradient(180deg,#fff6d6 0%,#f6c453 45%,#a8671a 70%,#ffe39a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3b2205) drop-shadow(0 0 22px rgba(246,196,83,.55));animation:float 4s ease-in-out infinite}
.helm{font-size:64px;animation:spin 14s linear infinite;filter:drop-shadow(0 0 18px rgba(63,224,255,.6))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}
.tag{margin-top:6px;font-size:15px;letter-spacing:4px;text-transform:uppercase;color:var(--cy);text-shadow:0 0 12px rgba(63,224,255,.7)}
.press{margin-top:56px;font-size:18px;letter-spacing:4px;text-transform:uppercase;padding:14px 26px;border-radius:40px;border:1px solid rgba(246,196,83,.6);background:rgba(20,14,4,.5);color:var(--gold2);animation:blink 1.6s ease-in-out infinite;box-shadow:0 0 30px rgba(246,196,83,.25)}
@keyframes blink{50%{opacity:.45;transform:scale(.97)}}
.ver{position:absolute;bottom:18px;font-size:11px;color:var(--mut);letter-spacing:2px}
@keyframes fadein{from{opacity:0}}

/* Sheet */
#modal:empty{display:none}
.backdrop{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:fadein .2s}
.sheet{width:100%;padding:20px 18px 24px;border-radius:22px 22px 0 0;background:linear-gradient(180deg,rgba(22,40,78,.98),rgba(8,16,34,.98));border-top:1px solid rgba(246,196,83,.45);box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .kicker{font-size:12px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.sheet h3{font-size:24px;margin:4px 0 8px;line-height:1.1}
.sheet p{color:var(--mut);font-size:16px;line-height:1.35;margin-bottom:14px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;letter-spacing:1px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--line);margin:0 6px 12px 0;text-transform:uppercase}
.center-modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.center-modal>div{width:100%;padding:22px;border-radius:18px;text-align:center;display:flex;flex-direction:column;gap:12px}

/* Buttons */
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:18px;letter-spacing:2px;text-transform:uppercase;color:#2a1700;background:linear-gradient(180deg,#ffd978,#e59a22);box-shadow:0 4px 0 #8a5410,0 0 22px rgba(246,196,83,.35);position:relative;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5410}
.btn:disabled{background:#2a3550;color:#6b7a99;box-shadow:0 4px 0 #18203a}
.btn.cy{background:linear-gradient(180deg,#8ff0ff,#18b5d8);color:#00222c;box-shadow:0 4px 0 #0b6a80,0 0 22px rgba(63,224,255,.35)}
.btn.rd{background:linear-gradient(180deg,#ff8da0,#e0284a);color:#2a0008;box-shadow:0 4px 0 #7c0d22,0 0 22px rgba(255,77,109,.35)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn+.btn{margin-top:10px}

/* Lesson */
.lbg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(63,224,255,.18),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(167,139,250,.2),transparent 55%),linear-gradient(180deg,#071328,#040914)}
.lbg.storm{background:radial-gradient(ellipse at 50% -10%,rgba(246,196,83,.18),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(255,77,109,.16),transparent 55%),linear-gradient(180deg,#120d18,#05050b)}
.lbg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:44px 44px;opacity:.05;animation:drift 30s linear infinite}
@keyframes drift{to{background-position:0 440px}}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;animation:flash .5s ease-out forwards}
.flash.bad{background:radial-gradient(ellipse at center,transparent 40%,rgba(255,40,80,.55))}
.flash.ok{background:radial-gradient(ellipse at center,rgba(74,222,128,.25),transparent 70%)}
@keyframes flash{to{opacity:0}}
.lesson{position:absolute;inset:0;overflow-y:auto;padding:14px 16px 230px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.x{width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--mut)}
.segp{flex:1;display:flex;gap:4px}
.segp i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.1);transform:skewX(-20deg)}
.segp i.on{background:linear-gradient(90deg,#3fe0ff,#8ff0ff);box-shadow:0 0 10px rgba(63,224,255,.8)}
.storm .segp i.on{background:linear-gradient(90deg,#f6a821,#ffe08a);box-shadow:0 0 10px rgba(246,196,83,.8)}
.combo{text-align:right;margin:-8px 4px 8px;font-family:"Cinzel Decorative",serif;font-size:20px;color:var(--gold2);text-shadow:0 0 14px rgba(246,196,83,.9),0 2px 0 #6b3f08;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.qcard{padding:18px 16px;margin-bottom:14px;animation:cardin .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes cardin{from{transform:translateY(24px) scale(.97);opacity:0}}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--cy);margin-bottom:8px}
.storm .kind{color:var(--gold)}
.prompt{font-size:23px;line-height:1.25}
.intro{padding:12px 14px;margin-bottom:12px;border-radius:14px;background:linear-gradient(135deg,rgba(246,196,83,.18),rgba(120,60,10,.15));border:1px solid rgba(246,196,83,.45);font-size:16px;line-height:1.35}
.intro b{color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;font-size:17px;background:linear-gradient(180deg,rgba(30,52,96,.75),rgba(14,28,58,.75));border:1px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .1s,box-shadow .2s,border-color .2s;animation:cardin .4s backwards}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt .key{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);flex:none}
.opt.sel{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 22px rgba(63,224,255,.35);transform:translateY(-1px)}
.opt.sel .key{background:var(--cy);color:#00222c}
.opt.right{border-color:var(--gr);box-shadow:0 0 0 1px var(--gr),0 0 22px rgba(74,222,128,.4)}
.opt.right .key{background:var(--gr);color:#002210}
.opt.wrong{border-color:var(--rd);box-shadow:0 0 0 1px var(--rd);opacity:.85}
.opt.wrong .key{background:var(--rd);color:#2a0008}
.opt:disabled{cursor:default}
.opt.gone{opacity:.25}
.term{position:relative;border-radius:14px;padding:12px;background:linear-gradient(180deg,rgba(0,20,30,.92),rgba(0,8,14,.95));border:1px solid rgba(63,224,255,.45);box-shadow:0 0 24px rgba(63,224,255,.18),inset 0 0 30px rgba(63,224,255,.06);font-family:"JetBrains Mono",monospace;font-size:14px;overflow:hidden}
.term::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.term .bar{display:flex;gap:6px;margin-bottom:10px}.term .bar i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .ln{display:flex;gap:8px;align-items:center}
.term .ps{color:#7dfcb5}
.term input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:16px;min-width:0;caret-color:var(--cy)}
.term pre{white-space:pre-wrap;margin-top:10px;color:#9fe8ff;font-family:inherit;font-size:12.5px;line-height:1.45;animation:type .5s steps(20)}
@keyframes type{from{clip-path:inset(0 100% 0 0)}}
.hint{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.4);font-size:15px;line-height:1.35;animation:cardin .3s}
.hint b{color:var(--gold)}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px 16px 18px;background:linear-gradient(180deg,rgba(8,16,34,.0),rgba(8,16,34,.96) 22%)}
.fb{padding:14px;border-radius:16px;margin-bottom:10px;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
.fb.ok{background:linear-gradient(135deg,rgba(74,222,128,.22),rgba(10,60,30,.5));border:1px solid rgba(74,222,128,.6)}
.fb.bad{background:linear-gradient(135deg,rgba(255,77,109,.22),rgba(70,8,20,.5));border:1px solid rgba(255,77,109,.6)}
.fb h4{font-size:22px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.fb.ok h4{color:#86efac}.fb.bad h4{color:#ff9aab}
.fb p{font-size:15px;margin-top:6px;line-height:1.35;color:#d7e2f5}
.fb code{font-family:"JetBrains Mono",monospace;font-size:13px;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px;word-break:break-word}
.fb .doc{display:inline-block;margin-top:8px;font-size:14px}
.floatxp{position:absolute;left:50%;top:40%;z-index:6;transform:translateX(-50%);font-family:"Cinzel Decorative",serif;font-size:34px;color:var(--gold2);text-shadow:0 0 18px rgba(246,196,83,.9),0 3px 0 #6b3f08;pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.spark{position:absolute;z-index:6;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* Result */
.res{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(246,196,83,.25),transparent 60%),linear-gradient(180deg,#0b1430,#040812)}
.rays{position:absolute;left:50%;top:30%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(246,196,83,.10) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%)}
.res>*:not(.rays){position:relative}
.vic{font-family:"Cinzel Decorative",serif;font-weight:900;font-size:40px;line-height:1.05;background:linear-gradient(180deg,#fff6d6,#f6c453 50%,#a8671a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3b2205) drop-shadow(0 0 20px rgba(246,196,83,.5));animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.sub{color:var(--mut);font-size:17px;margin:8px 0 18px}
.stars{display:flex;gap:10px;margin-bottom:18px;align-items:flex-end}
.stars span{font-size:52px;color:#2a3550;transition:all .3s}
.stars span:nth-child(2){font-size:64px}
.stars span.on{color:#ffd166;filter:drop-shadow(0 0 14px rgba(246,196,83,.9));animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-bottom:16px}
.kpi{padding:10px 6px}
.kpi small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
.kpi b{font-size:24px;font-family:"JetBrains Mono",monospace}
.promo{width:100%;padding:14px;margin-bottom:16px;border-radius:16px;background:linear-gradient(135deg,rgba(246,196,83,.3),rgba(90,50,5,.4));border:1px solid var(--gold);animation:pop .6s .6s backwards cubic-bezier(.2,1.5,.4,1)}
.promo b{font-size:22px;color:var(--gold2)}
.rkline{width:100%;padding:12px;margin-bottom:18px;text-align:left}

/* Pages */
.page{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 110px;background:radial-gradient(ellipse at 50% -20%,rgba(63,224,255,.15),transparent 60%),linear-gradient(180deg,#071328,#040914)}
.ptitle{font-family:"Cinzel Decorative",serif;font-size:26px;color:var(--gold2);text-shadow:0 0 14px rgba(246,196,83,.4);margin:6px 2px 12px}
.panel{padding:16px;margin-bottom:12px}
.panel h3{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:16px;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row span:last-child{font-family:"JetBrains Mono",monospace;color:var(--cy);font-size:14px}
.bigrank{display:flex;gap:14px;align-items:center}
.bigrank .emblem{width:70px;height:70px;font-size:36px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bd{text-align:center;font-size:11px;line-height:1.15;color:var(--mut)}
.bd .ic{width:58px;height:58px;margin:0 auto 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(180deg,rgba(246,196,83,.25),rgba(90,50,5,.3));border:1px solid rgba(246,196,83,.5);box-shadow:0 0 16px rgba(246,196,83,.2)}
.bd.off .ic{filter:grayscale(1);opacity:.35;box-shadow:none;border-color:var(--line);background:rgba(255,255,255,.04)}
.bd b{display:block;color:var(--txt);font-size:12px}
.pagebottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px 12px;z-index:3}
.hero{text-align:center;padding:26px 16px}
.hero .ic{font-size:72px;filter:drop-shadow(0 0 20px rgba(63,224,255,.5));animation:float 3s ease-in-out infinite}
.hero h2{font-family:"Cinzel Decorative",serif;font-size:28px;color:var(--gold2);margin:10px 0 6px}
.hero p{color:var(--mut);font-size:17px;line-height:1.35;margin-bottom:18px}
.seg{display:flex;padding:5px;margin-bottom:12px}.seg button{flex:1;background:none;padding:10px;border-radius:10px;color:var(--mut);font-size:16px;letter-spacing:1px;text-transform:uppercase}.seg button.on{background:rgba(246,196,83,.15);color:var(--gold)}
.form label{display:block;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.form select,.form input:not([type=checkbox]),.finput{display:block;width:100%;margin-top:6px;padding:13px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font-family:inherit;font-size:17px;font-weight:600;outline:none}
.form input:focus,.finput:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(63,224,255,.15)}
.chk{display:flex!important;gap:10px;align-items:flex-start;text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:var(--txt)!important;line-height:1.35}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#f6c453}
.chk em{color:var(--mut);font-style:normal;font-size:13px}
.ferr{color:#ff9aab;font-size:15px;margin:4px 0 12px;min-height:1px}
.fine{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}
.authp .btn.ghost{margin-top:4px}
.linkbtn{background:none;color:var(--rd);font-size:14px;margin-top:12px;text-decoration:underline}
.offer{width:100%;padding:14px;margin-bottom:12px;text-align:left;display:flex;flex-direction:column;gap:6px;border-color:rgba(246,196,83,.5)}
.offer b{font-size:18px}.offer span{color:var(--mut);font-size:15px;line-height:1.3}.offer .btn{margin-top:6px;text-align:center;text-decoration:none;padding:12px;font-size:15px}
.credit{position:absolute;bottom:40px;font-size:14px;letter-spacing:1px;color:var(--mut)}.credit b{color:var(--gold2);font-weight:700}
.creator .cr{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.creator img.avatar{object-fit:cover;padding:0}
.creator .avatar{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Cinzel Decorative",serif;font-size:20px;color:#2a1700;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c7902a 60%,#6b4310);box-shadow:0 0 0 2px #3b2608,0 0 16px rgba(246,196,83,.45)}
.creator b{display:block;font-size:19px}.creator span{color:var(--mut);font-size:14px}
.creator p{color:var(--mut);font-size:15px;line-height:1.35;margin-bottom:12px}
.crlinks{display:flex;gap:8px}.crlinks .btn{flex:1;text-align:center;text-decoration:none;font-size:13px;letter-spacing:1px;padding:11px 4px;margin:0}
.btn.share{margin-bottom:10px}
.form label em.optl{font-style:normal;text-transform:none;letter-spacing:0;color:var(--mut);opacity:.8}
select.finput,.form select{appearance:none;-webkit-appearance:none}
select option{background:#0b1430;color:#fff}
.notice{font-size:14px;line-height:1.4;color:var(--txt);background:rgba(63,224,255,.08);border:1px solid rgba(63,224,255,.35);border-radius:12px;padding:10px 12px;margin:-2px 0 14px}
.tsub{color:var(--mut);font-size:16px;line-height:1.35;margin:-4px 2px 14px}
.prod{display:flex;gap:14px;align-items:stretch}
.book{width:112px;flex:none;border-radius:6px 12px 12px 6px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,#123a63,#0a1d36 60%,#04101f);border:1px solid rgba(246,196,83,.55);box-shadow:inset 6px 0 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.5),0 0 18px rgba(63,224,255,.15)}
.bk-top{font-size:10px;letter-spacing:2px;color:var(--cy)}
.bk-title{font-family:"Cinzel Decorative",serif;font-size:14px;line-height:1.2;color:var(--gold2);flex:1}
.bk-author{font-size:10px;color:var(--mut);line-height:1.2}
.pinfo2{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pinfo2 h3{font-size:19px;line-height:1.15;color:var(--txt);letter-spacing:0;text-transform:none;margin:0}
.pinfo2 p{color:var(--mut);font-size:15px;line-height:1.35;flex:1}
.pinfo2 .btn{margin-top:4px;padding:12px;font-size:15px}
.badge2{align-self:flex-start;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(246,196,83,.45);border-radius:20px;padding:2px 10px}
.prod2{display:flex;gap:14px;align-items:flex-start}
.picon{width:56px;height:56px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.soon{color:var(--cy);font-size:14px;letter-spacing:1px;text-transform:uppercase;border:1px dashed rgba(63,224,255,.5);border-radius:10px;padding:10px;text-align:center}
.tabs button div{font-size:11px}
.ebook{display:flex;flex-direction:column;gap:8px}
.cover-wrap{display:flex;justify-content:center;padding:6px 0 4px;cursor:pointer;background:radial-gradient(ellipse at 50% 55%,rgba(255,140,60,.18),transparent 65%)}
.cover{width:62%;max-width:230px;height:auto;filter:drop-shadow(0 18px 28px rgba(0,0,0,.6));transform:perspective(900px) rotateY(-8deg);transition:transform .4s;animation:float 5s ease-in-out infinite}
.cover-wrap:active .cover{transform:perspective(900px) rotateY(0) scale(1.02)}
.panel .eb-title{font-size:24px;color:var(--txt);line-height:1.1;margin:2px 0 0;letter-spacing:0;text-transform:none;color:var(--txt)}
.eb-desc{color:var(--mut);font-size:16px;line-height:1.35}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.chips2 span{font-size:12px;padding:3px 9px;border-radius:7px;background:rgba(120,170,255,.12);border:1px solid var(--line);color:#c9d6f0}
.chips2 span.hot{background:rgba(255,140,60,.2);border-color:rgba(255,140,60,.6);color:#ffb27a}
.eb-author{display:flex;gap:10px;align-items:center;padding:8px 0 4px;border-top:1px solid var(--line);margin-top:4px}
.eb-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,140,60,.7)}
.eb-author b{display:block;font-size:15px}.eb-author small{color:var(--mut);font-size:12px}
.eb-offer{flex-direction:row!important;gap:12px!important;align-items:center}
.eb-offer img{width:92px;height:auto;flex:none;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));cursor:pointer}
.eb-offer>div{display:flex;flex-direction:column;gap:6px;min-width:0}
</style>
</head>
<body>
<div id="app"><div id="screen"></div><div id="modal"></div></div>
<script>
const R=String.raw;
const D=R`(?:deploy(?:ment)?s?(?:\.apps)?)(?: |\/)`;
const PO=R`(?:pods?|po)(?: |\/)`;
const SV=R`(?:svc|services?)(?: |\/)`;
const K='https://kubernetes.io/docs/';
const DOC={
 overview:K+'concepts/overview/',components:K+'concepts/overview/components/',
 cheat:K+'reference/kubectl/cheatsheet/',pods:K+'concepts/workloads/pods/',
 labels:K+'concepts/overview/working-with-objects/labels/',
 workloads:K+'concepts/workloads/',deploy:K+'concepts/workloads/controllers/deployment/',
 svc:K+'concepts/services-networking/service/',eps:K+'concepts/services-networking/endpoint-slices/',
 dns:K+'concepts/services-networking/dns-pod-service/',
 cm:K+'concepts/configuration/configmap/',secret:K+'concepts/configuration/secret/',
 vol:K+'concepts/storage/volumes/',pv:K+'concepts/storage/persistent-volumes/',sc:K+'concepts/storage/storage-classes/',
 ing:K+'concepts/services-networking/ingress/',ingc:K+'concepts/services-networking/ingress-controllers/',gw:K+'concepts/services-networking/gateway/',
 ns:K+'concepts/overview/working-with-objects/namespaces/',res:K+'concepts/configuration/manage-resources-containers/',
 rbac:K+'reference/access-authn-authz/rbac/',debug:K+'tasks/debug/debug-application/debug-pods/',
 probes:K+'concepts/workloads/pods/probes/',hpa:K+'tasks/run-application/horizontal-pod-autoscale-walkthrough/',
 pdb:K+'concepts/workloads/pods/disruptions/',drain:K+'tasks/administer-cluster/safely-drain-node/',
 helm:'https://helm.sh/docs/',argo:'https://argo-cd.readthedocs.io/en/stable/'};
const q=(p,o,h,s)=>({t:'q',p,o,h,s});
const c=(p,a,ex,out,h,s)=>({t:'c',p,a:[].concat(a),ex,out,h,s});

const U=[
{t:'Fundamentos',ic:'🧭',
 l:{t:'O que é Kubernetes',it:[
  q('O nome Kubernetes vem do grego e significa:',['Timoneiro ou piloto','Contêiner','Nuvem distribuída','Orquestra'],'Aquele que conduz o navio. Por isso o logo é um leme.',DOC.overview),
  q('No Kubernetes você declara o ___ e o cluster trabalha para alcançá-lo.',['estado desejado','script de deploy','IP do servidor','log de execução'],'É declarativo: você diz O QUE quer, não COMO fazer.',DOC.overview),
  q('Qual componente do control plane guarda todo o estado do cluster?',['etcd','kubelet','kube-proxy','CoreDNS'],'É um armazenamento chave-valor consistente e de alta disponibilidade.',DOC.components),
  q('Qual agente roda em cada node e garante que os contêineres de um Pod estejam rodando?',['kubelet','etcd','kube-scheduler','kube-controller-manager'],'É o "agente" do Kubernetes dentro de cada máquina.',DOC.components),
  c('Liste os nodes do cluster.',R`^kubectl get (?:nodes?|no)$`,'kubectl get nodes','NAME         STATUS   ROLES           AGE   VERSION\nlab-node-1   Ready    control-plane   12d   v1.34.2','Use o verbo get seguido do tipo de recurso.',DOC.cheat)]},
 b:{t:'Primeiro contato',intro:'Seu kubeconfig acabou de chegar. Prove que você enxerga o cluster do lab.',it:[
  c('Mostre as informações do cluster (endereço do control plane).',R`^kubectl cluster-info$`,'kubectl cluster-info','Kubernetes control plane is running at https://10.0.0.10:6443\nCoreDNS is running at https://10.0.0.10:6443/api/v1/...','Existe um subcomando com "cluster" no nome.',DOC.cheat),
  c('Liste os nodes com mais detalhes (IP interno, sistema operacional).',R`^kubectl get (?:nodes?|no) -o ?wide$`,'kubectl get nodes -o wide','NAME         STATUS   INTERNAL-IP   OS-IMAGE           CONTAINER-RUNTIME\nlab-node-1   Ready    10.0.0.10     Ubuntu 24.04 LTS   containerd://2.0.5','O formato de saída é escolhido com -o.',DOC.cheat),
  c('Liste todos os tipos de recurso que a API oferece.',R`^kubectl api-resources$`,'kubectl api-resources','NAME       SHORTNAMES   APIVERSION   NAMESPACED   KIND\npods       po           v1           true         Pod\nservices   svc          v1           true         Service\n...','"api" + "resources".',DOC.cheat)]}},
{t:'Pods',ic:'🫛',
 l:{t:'A menor unidade',it:[
  q('Segundo a documentação, o que é um Pod?',['A menor unidade implantável, com um ou mais contêineres','Uma máquina do cluster','Um tipo de Service','Um volume de disco'],'Os contêineres de um Pod compartilham rede e armazenamento.',DOC.pods),
  q('Na prática, você costuma criar Pods diretamente?',['Raramente: normalmente via Deployment ou Job','Sempre, é a forma recomendada','Só em produção','Só com Helm'],'A documentação recomenda usar recursos de workload.',DOC.pods),
  c('Crie um Pod chamado nginx com a imagem nginx.',R`^kubectl run nginx --image[= ]nginx(?::\S+)?$`,'kubectl run nginx --image=nginx','pod/nginx created','O verbo é run; a imagem vai em --image.',DOC.cheat),
  c('Mostre os detalhes e eventos do Pod nginx.',R`^kubectl describe ${PO}nginx$`,'kubectl describe pod nginx','Name:   nginx\nStatus: Running\nEvents:\n  Normal  Pulled   Successfully pulled image "nginx"\n  Normal  Started  Started container nginx','Para detalhes + eventos, o verbo não é get.',DOC.debug),
  c('Veja os logs do Pod nginx.',R`^kubectl logs (?:pods?\/)?nginx$`,'kubectl logs nginx','/docker-entrypoint.sh: Configuration complete; ready for start up','O verbo tem o nome do que você quer ver.',DOC.cheat)]},
 b:{t:'Pod rotulado',intro:'O time precisa de um Pod web identificado por label e acessível para debug.',it:[
  c('Crie o Pod nginx-aluno com imagem nginx e a label app=web.',R`^kubectl run nginx-aluno(?=.*--image[= ]nginx\b)(?=.*(?:--labels?[= ]"?app=web"?|-l "?app=web"?))`,'kubectl run nginx-aluno --image=nginx --labels=app=web','pod/nginx-aluno created','Além de --image, o run aceita --labels.',DOC.labels),
  c('Liste os Pods filtrando pela label app=web.',R`^kubectl get (?:pods?|po) (?:-l|--selector)[= ]"?app=web"?$`,'kubectl get pods -l app=web','NAME          READY   STATUS    RESTARTS   AGE\nnginx-aluno   1/1     Running   0          20s','Filtro por label usa -l.',DOC.labels),
  c('Abra um shell interativo dentro do Pod nginx-aluno.',R`^kubectl exec (?:-it|-ti|-i -t|-t -i) nginx-aluno -- (?:\/bin\/)?(?:ba)?sh$`,'kubectl exec -it nginx-aluno -- sh','root@nginx-aluno:/#','exec com -it e o comando depois de --.',DOC.cheat)]}},
{t:'Deployments',ic:'🚀',
 l:{t:'Réplicas e rollouts',it:[
  q('Para que tipo de aplicação o Deployment é indicado?',['Stateless, com Pods intercambiáveis','Bancos de dados que precisam de identidade fixa','Tarefas que rodam uma vez e terminam','Um Pod por node'],'Para estado persistente, a doc indica StatefulSet.',DOC.workloads),
  c('Crie o Deployment web com a imagem nginx:1.25.',R`^kubectl create (?:deploy(?:ment)?) web --image[= ]nginx:1\.25$`,'kubectl create deployment web --image=nginx:1.25','deployment.apps/web created','create + deployment.',DOC.deploy),
  c('Escale o Deployment web para 3 réplicas.',R`^kubectl scale ${D}web --replicas[= ]3$`,'kubectl scale deployment web --replicas=3','deployment.apps/web scaled','O verbo é scale; a quantidade vai em --replicas.',DOC.deploy),
  q('Qual objeto o Deployment gerencia para manter o número de réplicas?',['ReplicaSet','StatefulSet','DaemonSet','Job'],'O nome tem "Replica".',DOC.deploy),
  c('Desfaça o último rollout do Deployment web.',R`^kubectl rollout undo ${D}web$`,'kubectl rollout undo deployment web','deployment.apps/web rolled back','Tudo sobre rollout fica em kubectl rollout ...',DOC.deploy)]},
 b:{t:'Deploy sem queda',intro:'Saiu a versão nova do nginx. Atualize o web, acompanhe e confira o histórico.',it:[
  c('Atualize a imagem do contêiner nginx do Deployment web para nginx:1.27.',R`^kubectl set image ${D}web nginx=nginx:1\.27$`,'kubectl set image deployment/web nginx=nginx:1.27','deployment.apps/web image updated','set image com contêiner=imagem.',DOC.deploy),
  c('Acompanhe o rollout até terminar.',R`^kubectl rollout status ${D}web$`,'kubectl rollout status deployment/web','Waiting for rollout to finish: 2 of 3 updated replicas are available...\ndeployment "web" successfully rolled out','Subcomando de rollout.',DOC.deploy),
  c('Veja o histórico de revisões do web.',R`^kubectl rollout history ${D}web$`,'kubectl rollout history deployment/web','REVISION  CHANGE-CAUSE\n1         <none>\n2         <none>','rollout + "histórico" em inglês.',DOC.deploy)]}},
{t:'Services e rede',ic:'🌐',
 l:{t:'Endereço estável',it:[
  q('Por que precisamos de Services?',['Pods são efêmeros e mudam de IP; o Service dá um endereço estável','Para guardar senhas','Para adicionar nodes','Para armazenar logs'],'Pods nascem e morrem com IPs novos.',DOC.svc),
  c('Exponha o Deployment web na porta 80 com um Service chamado web-svc.',R`^kubectl expose ${D}web(?=.*--port[= ]80\b)(?=.*--name[= ]web-svc\b)`,'kubectl expose deployment web --port=80 --name=web-svc','service/web-svc exposed','O verbo é expose; use --port e --name.',DOC.svc),
  q('Desde a v1.33, a API Endpoints está obsoleta. O que a substitui?',['EndpointSlice','NetworkPolicy','Ingress','ServiceAccount'],'O nome sugere "fatias" de endpoints.',DOC.eps),
  c('Liste os EndpointSlices do Service web-svc (filtre pela label kubernetes.io/service-name).',R`^kubectl get (?:endpointslices?|eps?) (?:-l|--selector)[= ]["']?kubernetes\.io\/service-name=web-svc["']?$`,'kubectl get endpointslice -l kubernetes.io/service-name=web-svc','NAME            ADDRESSTYPE   PORTS   ENDPOINTS                          AGE\nweb-svc-7vzhx   IPv4          80      10.42.0.12,10.42.0.13,10.42.0.14   15s','EndpointSlices são buscados por label, não por nome.',DOC.eps),
  q('Service sem endpoints. Causa mais provável?',['O selector não bate com as labels dos Pods','Porta 80 bloqueada no DNS','Falta um ConfigMap','O cluster está sem etcd'],'O Service encontra os Pods por label.',DOC.svc)]},
 b:{t:'Rede de pé',intro:'O web-svc precisa ser testado antes de ir pra fora do cluster.',it:[
  c('Liste os Services do namespace.',R`^kubectl get (?:svc|services?)$`,'kubectl get svc','NAME      TYPE        CLUSTER-IP     PORT(S)\nweb-svc   ClusterIP   10.43.18.200   80/TCP','get + svc.',DOC.svc),
  c('Descreva o Service web-svc para conferir o selector.',R`^kubectl describe ${SV}web-svc$`,'kubectl describe svc web-svc','Name:      web-svc\nSelector:  app=web\nEndpoints: 10.42.0.12:80,10.42.0.13:80,10.42.0.14:80','Detalhes = describe.',DOC.svc),
  c('Faça port-forward do web-svc: porta local 8080 para a 80.',R`^kubectl port-forward ${SV}web-svc 8080:80$`,'kubectl port-forward svc/web-svc 8080:80','Forwarding from 127.0.0.1:8080 -> 80','port-forward; formato local:remota.',DOC.cheat)]}},
{t:'ConfigMaps e Secrets',ic:'🔐',
 l:{t:'Configuração fora da imagem',it:[
  q('Para que serve um ConfigMap?',['Separar configuração não confidencial da imagem do contêiner','Guardar senhas criptografadas','Expor portas','Escalar Pods'],'Assim a mesma imagem roda em vários ambientes.',DOC.cm),
  c('Crie o ConfigMap app-config com COR=azul.',R`^kubectl create (?:configmap|cm) app-config --from-literal[= ]"?COR=azul"?$`,'kubectl create configmap app-config --from-literal=COR=azul','configmap/app-config created','Valores diretos usam --from-literal.',DOC.cm),
  c('Crie o Secret genérico db-pass com senha=123.',R`^kubectl create secret generic db-pass --from-literal[= ]"?senha=123"?$`,'kubectl create secret generic db-pass --from-literal=senha=123','secret/db-pass created','create secret, do tipo generic.',DOC.secret),
  q('Por padrão, como os Secrets ficam guardados no etcd?',['Sem criptografia: é preciso habilitar a criptografia em repouso','Criptografados com AES-256','Criptografados só em produção','Fora do etcd'],'base64 é codificação, não criptografia.',DOC.secret),
  q('Qual campo injeta TODAS as chaves de um ConfigMap como variáveis?',['envFrom','env','volumeMounts','args'],'É o env "a partir de" algo.',DOC.cm)]},
 b:{t:'App configurada',intro:'O web precisa receber a cor e a senha do banco sem rebuild da imagem.',it:[
  c('Injete o ConfigMap app-config como variáveis no Deployment web.',R`^kubectl set env ${D}web --from[= ](?:configmap|cm)\/app-config$`,'kubectl set env deployment/web --from=configmap/app-config','deployment.apps/web env updated','set env com --from=tipo/nome.',DOC.cm),
  c('Injete também o Secret db-pass.',R`^kubectl set env ${D}web --from[= ]secret\/db-pass$`,'kubectl set env deployment/web --from=secret/db-pass','deployment.apps/web env updated','Igual ao anterior, trocando o tipo.',DOC.secret),
  c('Confira a variável COR dentro de um Pod do web.',R`^kubectl exec (?:-it |-ti )?(?:deploy(?:ment)?\/web|web-\S+) -- (?:printenv(?: COR)?|env|sh -c .*COR.*)$`,'kubectl exec deploy/web -- printenv COR','azul','exec em deploy/web e rode printenv.',DOC.cheat)]}},
{t:'Armazenamento',ic:'💾',
 l:{t:'Dados que sobrevivem',it:[
  q('Um volume emptyDir sobrevive à remoção do Pod?',['Não: ele existe enquanto o Pod existir','Sim, sempre','Só se tiver label','Só com StorageClass'],'O nome já diz: começa vazio, junto com o Pod.',DOC.vol),
  q('Quem PEDE armazenamento: PV ou PVC?',['O PVC é o pedido; o PV é o volume provisionado','O PV','Os dois','Nenhum, é o Service'],'C de Claim = reivindicação.',DOC.pv),
  c('Liste as StorageClasses do cluster.',R`^kubectl get (?:sc|storageclass(?:es)?)$`,'kubectl get storageclass','NAME                   PROVISIONER             RECLAIMPOLICY\nlocal-path (default)   rancher.io/local-path   Delete','Abreviação: sc.',DOC.sc),
  c('Liste os PVCs do namespace.',R`^kubectl get (?:pvc|persistentvolumeclaims?)$`,'kubectl get pvc','NAME    STATUS   VOLUME        CAPACITY   STORAGECLASS\ndados   Bound    pvc-7f3a...   1Gi        local-path','As iniciais.',DOC.pv),
  q('Status de um PVC já ligado a um PV:',['Bound','Ready','Running','Attached'],'Significa "vinculado".',DOC.pv)]},
 b:{t:'Persistência provada',intro:'Você tem um pvc.yaml (1Gi) e um Pod app-dados que grava em /data. Prove que os dados sobrevivem.',it:[
  c('Aplique o manifesto pvc.yaml.',R`^kubectl apply -f \.?\/?pvc\.ya?ml$`,'kubectl apply -f pvc.yaml','persistentvolumeclaim/dados created','apply com -f arquivo.',DOC.pv),
  c('Confira se o PVC dados está Bound.',R`^kubectl get (?:pvc|persistentvolumeclaims?) dados$`,'kubectl get pvc dados','NAME    STATUS   CAPACITY\ndados   Bound    1Gi','get pvc + nome.',DOC.pv),
  c('Apague o Pod app-dados (ele será recriado e o arquivo continua lá).',R`^kubectl delete ${PO}app-dados$`,'kubectl delete pod app-dados','pod "app-dados" deleted\n✔ Pod recriado: /data/teste.txt continua lá','O verbo é delete.',DOC.pv)]}},
{t:'Ingress e Gateway',ic:'🚪',
 l:{t:'Tráfego de fora pra dentro',it:[
  q('O que um Ingress faz?',['Roteia HTTP/HTTPS de fora do cluster para Services, por host e path','Cria nodes','Guarda senhas','Escala Pods'],'Pense num "porteiro" HTTP.',DOC.ing),
  q('Criar um recurso Ingress num cluster novo já faz ele funcionar?',['Não: é preciso ter um ingress controller rodando','Sim, o controller sobe junto com o cluster','Só se o Service for NodePort','Só com Helm'],'Diferente de outros controllers, ele não roda dentro do kube-controller-manager.',DOC.ingc),

// ---------- estado ----------
const KEY='timoneiro-v2';
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>dstr(new Date());
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const fresh=()=>({xp:0,budget:5,bTs:Date.now(),up:0,last:null,done:{},stars:{},miss:{},daily:null,runs:0,best:0,boatSeen:0,mute:false,bestCombo:0,updatedAt:0,offers:{}});
let st=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)st=Object.assign(fresh(),s)}catch(e){}
const save=()=>{st.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};if(typeof syncSoon==='function')syncSoon()};
function regen(){if(st.budget>=5){st.bTs=Date.now();return}const n=Math.floor((Date.now()-st.bTs)/(4*3600e3));if(n>0){st.budget=Math.min(5,st.budget+n);st.bTs+=n*4*3600e3}}
regen();
if(st.last&&st.last!==today()&&st.last!==yest())st.up=0;
function bumpUptime(){const t=today();if(st.last===t)return;st.up=st.last===yest()?st.up+1:1;st.last=t;st.best=Math.max(st.best,st.up)}
const RANKS=[[0,'Grumete','🪢'],[100,'Marinheiro','⛵'],[300,'Contramestre','🧭'],[600,'Imediato','🔭'],[1000,'Capitão','⚓'],[1500,'Almirante','🎖️']];
function rankOf(xp){let i=0;RANKS.forEach((r,j)=>{if(xp>=r[0])i=j});const cur=RANKS[i],next=RANKS[i+1];return{cur,next,pct:next?Math.round((xp-cur[0])/(next[0]-cur[0])*100):100}}
const nodes=[];U.forEach((u,i)=>{nodes.push(i+'l');nodes.push(i+'b')});
const unlocked=id=>{const i=nodes.indexOf(id);return i===0||!!st.done[nodes[i-1]]};
const nextNode=()=>nodes.find(id=>unlocked(id)&&!st.done[id]);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nodeInfo=id=>{const ui=+id.slice(0,-1),k=id.slice(-1),u=U[ui];return{ui,k,u,src:k==='l'?u.l:u.b}};

// ---------- áudio (sintetizado) ----------
let AC=null;
function sfx(type){if(st.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t0=AC.currentTime;
 const S0={click:[[880,.04]],ok:[[523,.07],[659,.07],[784,.07],[1047,.16]],bad:[[196,.12],[147,.22]],win:[[392,.1],[523,.1],[659,.1],[784,.1],[1047,.4]],start:[[262,.14],[392,.14],[523,.14],[784,.5]],combo:[[784,.06],[988,.06],[1319,.14]],open:[[440,.05],[660,.08]]}[type]||[];
 let o=0;S0.forEach(([f,d])=>{const os=AC.createOscillator(),g=AC.createGain();os.type=type==='bad'?'sawtooth':'triangle';os.frequency.setValueAtTime(f,t0+o);g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(type==='bad'?.12:.16,t0+o+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+o+d);os.connect(g);g.connect(AC.destination);os.start(t0+o);os.stop(t0+o+d+.03);o+=d*.85});}catch(e){}}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

// ---------- mundo (canvas) ----------
const WW=420,GAP=340,TOP0=300;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const WP=(()=>{const w=[{x:210,y:175}];U.forEach((u,i)=>{const L=i%2===0,cx=L?128:292,cy=TOP0+120+i*GAP;w.push({x:cx+(L?70:-70),y:cy+22,cx,cy,i});w.push({x:210+(L?36:-36),y:cy+GAP/2+28,storm:true,i})});const l=w[w.length-1];w.push({x:210,y:l.y+190,treasure:true});return w})();
const WH=WP[WP.length-1].y+230;
const POLY=[],WPL=[0];
(()=>{let acc=0,prev={x:WP[0].x,y:WP[0].y,l:0};POLY.push(prev);for(let i=0;i<WP.length-1;i++){const p0=WP[i-1]||WP[i],p1=WP[i],p2=WP[i+1],p3=WP[i+2]||p2;const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};for(let s=1;s<=28;s++){const t=s/28,u=1-t;const q={x:u*u*u*p1.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p2.x,y:u*u*u*p1.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p2.y};acc+=Math.hypot(q.x-prev.x,q.y-prev.y);q.l=acc;POLY.push(q);prev=q}WPL.push(acc)}})();
function pointAt(len){let lo=0,hi=POLY.length-1;if(len<=0)return{...POLY[0],dx:1};if(len>=POLY[hi].l)return{...POLY[hi],dx:0};while(hi-lo>1){const m=(lo+hi)>>1;if(POLY[m].l<len)lo=m;else hi=m}const a=POLY[lo],b=POLY[hi],t=(len-a.l)/((b.l-a.l)||1);return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,dx:b.x-a.x}}
function boatIdx(){let n=0;for(const id of nodes){if(st.done[id])n++;else break}return n>=nodes.length?WP.length-1:n}
// ilhas
const ISL=U.map((u,i)=>{const p=WP[1+i*2],r=rng(1000+i*77),N=22,pts=[];for(let k=0;k<N;k++){const a=k/N*Math.PI*2,j=.82+r()*.3;pts.push([Math.cos(a)*86*j,Math.sin(a)*56*j])}
 const palms=[];for(let k=0;k<3;k++)palms.push({x:(r()-.5)*90,y:(r()-.6)*40,s:.8+r()*.5,ph:r()*6});const rocks=[];for(let k=0;k<3;k++)rocks.push({x:(r()-.5)*130,y:(r()-.2)*60,s:4+r()*6});return{cx:p.cx,cy:p.cy,pts,palms,rocks,hut:r()>.5}});
const WAVES=(()=>{const r=rng(7),a=[];for(let k=0;k<170;k++)a.push({x:r()*WW,y:r()*WH,w:8+r()*16,sp:.2+r()*.5,ph:r()*6});return a})();
const CLOUDS=(()=>{const r=rng(11),a=[];for(let k=0;k<16;k++)a.push({x:r()*WW,y:r()*WH,s:30+r()*40,sp:.05+r()*.12,n:4+(r()*4|0),seed:r()*1000});return a})();
const GULLS=(()=>{const r=rng(5),a=[];for(let k=0;k<5;k++)a.push({x:r()*WW,y:200+r()*WH,sp:.25+r()*.3,ph:r()*6});return a})();
const DECOR=[['🐋',360,820],['🦈',48,1500],['🐙',372,2180],['🐢',44,2860],['🦑',370,3540]];
let causticTile=null;
function makeCaustic(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),r=rng(3);for(let k=0;k<70;k++){const x=r()*256,y=r()*256,rad=10+r()*36;for(const ox of[-256,0,256])for(const oy of[-256,0,256]){const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rad);gr.addColorStop(0,'rgba(140,240,255,.10)');gr.addColorStop(1,'rgba(140,240,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x+ox,y+oy,rad,0,7);g.fill()}}return c}

const W={reveal:1,ga:1,cv:null,ctx:null,raf:0,camY:0,camTarget:0,scale:1,vh:0,drag:null,manualUntil:0,boatLen:0,animFrom:0,animTo:0,animT0:0,animDur:0,anim:false,wake:[],flash:0,t:0};
function lenAtIdx(k){return WPL[Math.max(0,Math.min(k,WPL.length-1))]}
function initWorld(){
 const cv=document.getElementById('world');if(!cv)return;W.cv=cv;W.ctx=cv.getContext('2d');if(!causticTile)causticTile=makeCaustic();
 resize();const bi=boatIdx(),from=Math.min(st.boatSeen||0,bi);W.boatLen=lenAtIdx(from);W.anim=false;
 const p=pointAt(W.boatLen);W.camY=W.camTarget=clampCam(p.y-W.vh*.45);
 if(bi>from&&!splashOn){setTimeout(()=>sailTo(bi),700)}
 bindPointer();cancelAnimationFrame(W.raf);W.raf=requestAnimationFrame(loop);
}

function renderModal(){$m.innerHTML=modalHtml()}
function renderScreen(){
 const v={home,profile,daily,lesson,result,empty,auth,tesouro}[view]||home;
 $s.innerHTML=v();
 if(view==='home')initWorld();
 const el=document.getElementById('cmd');
 if(el){el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(S.fb)next();else check()}});el.addEventListener('input',e=>{S.input=e.target.value})}
}
document.addEventListener('keydown',e=>{if(view==='lesson'&&e.key==='Enter'&&!document.getElementById('cmd')&&!modal&&S){if(S.fb)next();else if(S.sel!==null)check()}});

const API={online:false,tok:null,user:null,cfg:{},guest:false,timer:0};
try{API.tok=localStorage.getItem('timoneiro-token');API.guest=localStorage.getItem('timoneiro-guest')==='1'}catch(e){}
async function api(method,path,body){const h={'Content-Type':'application/json'};if(API.tok)h.Authorization='Bearer '+API.tok;
 const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){if(r.status===401&&API.tok&&path!=='/api/login'){setSession(null)}throw new Error(j.error||'Falha de conexão')}return j}
function setSession(tok,user){API.tok=tok;API.user=user||null;try{tok?localStorage.setItem('timoneiro-token',tok):localStorage.removeItem('timoneiro-token')}catch(e){}}
function adoptState(remote){if(!remote)return false;const lx=st.xp|0,rx=remote.xp|0;if(rx>lx||(rx===lx&&(remote.updatedAt||0)>(st.updatedAt||0))){st=Object.assign(fresh(),remote);try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}return true}return false}
function syncSoon(){if(!API.tok)return;clearTimeout(API.timer);API.timer=setTimeout(()=>{api('PUT','/api/me/progress',{state:st}).catch(()=>{})},1200)}
async function boot(){
 try{const r=await fetch('/api/config');if(r.ok&&(r.headers.get('content-type')||'').includes('json')){API.cfg=await r.json();API.online=true}}catch(e){}
 if(API.online&&API.tok){try{const j=await api('GET','/api/me');API.user=j.user;if(!adoptState(j.state))syncSoon()}catch(e){}}
 renderScreen();
}
let gateNext=null,authGate=false;
let authTab='new',authErr='',authBusy=false,authForm={name:'',email:'',password:'',phone:'',area:''};
function auth(){const c=API.cfg;return `<div class="page authp"><div class="hero" style="padding:20px 6px 6px"><div class="ic" style="font-size:54px">☸</div><h2>${authGate?'Continue a rota':'Bem-vindo a bordo'}</h2><p>${authGate?'Você concluiu a amostra grátis. Crie sua conta para liberar as próximas ilhas e salvar seu progresso.':'Crie sua conta para salvar seu progresso em qualquer aparelho e subir no ranking da mentoria.'}</p></div>
 <div class="seg glass"><button class="${authTab==='new'?'on':''}" onclick="authTab='new';authErr='';renderScreen()">Criar conta</button><button class="${authTab==='in'?'on':''}" onclick="authTab='in';authErr='';renderScreen()">Entrar</button></div>
 <form class="panel glass form" onsubmit="event.preventDefault();doAuth()">
 ${authTab==='new'?`<label>Nome<input id="f-name" autocomplete="name" maxlength="80" required value="${esc(authForm.name)}"></label>`:''}

 ${authTab==='new'?`<label>WhatsApp <em class="optl">(obrigatório)</em><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(19) 99999-8888" value="${esc(authForm.phone||'')}"></label>
 <div class="notice">📱 ${esc(c.phoneNotice||'O WhatsApp é obrigatório para criar sua conta.')}</div>
 <label>Sua área <em class="optl">(opcional)</em><select id="f-area"><option value="">Selecione</option>${(c.areas||[]).map(a=>`<option ${authForm.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></label>`:''}
 ${authTab==='new'?`<label class="chk"><input type="checkbox" id="f-terms" ${authForm.terms?'checked':''}><span>Li e aceito os Termos de Uso e a <a href="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a>. <em>(obrigatório)</em></span></label>
 <label class="chk"><input type="checkbox" id="f-mkt" ${authForm.marketing?'checked':''}><span>${esc(c.marketingText||'Quero receber novidades e ofertas por e-mail. Posso cancelar quando quiser.')} <em>(opcional)</em></span></label>
 <label class="chk"><input type="checkbox" id="f-wa" ${authForm.whatsapp?'checked':''}><span>${esc(c.whatsappText||'Quero receber contato pelo WhatsApp. Posso cancelar quando quiser.')} <em>(opcional)</em></span></label>`:''}
 ${authErr?`<div class="ferr">${esc(authErr)}</div>`:''}
 <button class="btn" type="submit" ${authBusy?'disabled':''}>${authBusy?'Aguarde…':authTab==='new'?'Criar conta e zarpar':'Entrar'}</button></form>
 <button class="btn ghost" onclick="playGuest()">Jogar como convidado</button>
 <p class="fine">Como convidado, o progresso fica salvo só neste aparelho.</p></div>`}
async function doAuth(){const v=id=>{const e=document.getElementById(id);return e?e.value:''},ck=id=>{const e=document.getElementById(id);return !!(e&&e.checked)};
 authForm={name:v('f-name'),email:v('f-email'),password:v('f-pass'),terms:ck('f-terms'),marketing:ck('f-mkt'),phone:v('f-phone'),area:v('f-area'),whatsapp:ck('f-wa')};
 authErr='';if(authTab==='new'&&!ck('f-terms')){authErr='Para criar a conta, aceite os Termos e a Política de Privacidade.';renderScreen();return}
 if(authTab==='new'&&authForm.phone.replace(/\D/g,'').length<10){authErr='Informe seu WhatsApp com DDD para criar a conta.';renderScreen();return}
 const form={name:v('f-name'),email:v('f-email'),password:v('f-pass'),terms:ck('f-terms'),marketing:ck('f-mkt'),phone:v('f-phone'),area:v('f-area'),whatsapp:ck('f-wa')};
 authBusy=true;renderScreen();
 try{const j=authTab==='new'?await api('POST','/api/register',{...form,state:st}):await api('POST','/api/login',{email:form.email,password:form.password});
  setSession(j.token,j.user);if(authTab==='in'&&!adoptState(j.state))syncSoon();API.guest=false;try{localStorage.removeItem('timoneiro-guest')}catch(e){}
  authBusy=false;authForm={name:'',email:'',password:'',phone:'',area:''};sfx('win');authGate=false;view='home';renderScreen();if(gateNext&&API.user&&!API.user.phone){modal='gate';renderModal()}else if(gateNext){const g=gateNext;gateNext=null;setTimeout(()=>start(g[0],g[1]),400)}}
 catch(e){authBusy=false;authErr=e.message;sfx('bad');renderScreen()}}
function playGuest(){API.guest=true;authGate=false;try{localStorage.setItem('timoneiro-guest','1')}catch(e){}view='home';renderScreen()}

async function saveGatePhone(){const v=id=>(document.getElementById(id)||{}).value||'';const wa=!!(document.getElementById('pf-wa')||{}).checked;try{let j=await api('PUT','/api/me/profile',{phone:v('pf-phone'),area:v('pf-area')});if(wa)j=await api('PUT','/api/me/consent',{whatsapp:true});API.user=j.user;modal=null;renderModal();sfx('ok');if(gateNext){const g=gateNext;gateNext=null;setTimeout(()=>start(g[0],g[1]),300)}}catch(e){const el=document.getElementById('pf-err');if(el)el.textContent=e.message}}
async function saveProfile(){const v=id=>(document.getElementById(id)||{}).value||'';try{const j=await api('PUT','/api/me/profile',{phone:v('pf-phone'),area:v('pf-area')});API.user=j.user;modal=null;renderModal();renderScreen();sfx('ok')}catch(e){const el=document.getElementById('pf-err');if(el)el.textContent=e.message}}
async function exportData(){try{const j=await api('GET','/api/me/export');const b=new Blob([JSON.stringify(j,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meus-dados-timoneiro.json';document.body.appendChild(a);a.click();a.remove()}catch(e){alertBox(e.message)}}

function creatorCard(){const m=API.cfg&&API.cfg.mentoriaUrl;return `<div class="panel glass creator"><h3>Sobre o criador</h3>
 <div class="cr">${CREATOR.photo?`<img class="avatar" src="${CREATOR.photo}" alt="${CREATOR.name}">`:'<div class="avatar">EL</div>'}<div><b>${CREATOR.name}</b><span>${CREATOR.role} · Kubernetes e ArgoCD</span></div></div>
 <p>Criei o Timoneiro para quem está começando em Kubernetes aprender praticando, do jeito que eu gostaria de ter aprendido.</p>
 <div class="crlinks"><a class="btn ghost" href="${CREATOR.linkedin}" target="_blank" rel="noopener">LinkedIn</a><a class="btn ghost" href="${CREATOR.instagram}" target="_blank" rel="noopener">Instagram</a><a class="btn ghost" href="${CREATOR.github}" target="_blank" rel="noopener">GitHub</a></div>
 <button class="btn" style="margin-top:10px" onclick="buy('ebook','criador')">📘 E-book: ${esc(ebookTitle())}</button>
 ${m?`<button class="btn ghost" style="margin-top:10px" onclick="buy('mentoria','criador')">Conhecer a mentoria</button>`:''}</div>`}
async function shareWin(){const r=S&&S.result||{},rk=rankOf(st.xp).cur[1];
 const what=r.promo?`Conquistei a patente ${r.promo[1]}`:`Superei a tempestade "${S.title}"`,extra=r.promo?'':` Patente atual: ${rk}.`;
 const url=location.origin&&location.origin.startsWith('http')?location.origin:'';
 const text=`⚓ ${what} no Timoneiro, o jogo para aprender Kubernetes criado por ${CREATOR.name} (${CREATOR.handle}).${extra}${url?' Jogue também: '+url:''} #Kubernetes #DevOps #Timoneiro`;
 try{if(navigator.share){await navigator.share({title:'Timoneiro',text,url:url||undefined});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);alertBox('Texto copiado! Cole no LinkedIn, Instagram ou WhatsApp.')}catch(e){alertBox(text)}}

// ---------- tesouro (produtos) ----------
function withUtm(url,where){try{const u=new URL(url);u.searchParams.set('utm_source','timoneiro');u.searchParams.set('utm_medium','app');u.searchParams.set('utm_content',where);return u.toString()}catch(e){return url}}
